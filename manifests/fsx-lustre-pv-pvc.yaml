# Static PV + PVC binding the pre-created FSx for Lustre (Step 4) via the FSx CSI driver.
# Render + apply:  envsubst '${FSX_ID} ${FSX_DNS} ${FSX_MOUNT}' < manifests/fsx-lustre-pv-pvc.yaml | kubectl apply -f -
# GDS works through this CSI-mounted path — verified: the nvidia-fs readMiB counter still moves by
# the full checkpoint (DMA), not the CPU compat path.
apiVersion: v1
kind: PersistentVolume
metadata: { name: fsx-dsv4p-pv }
spec:
  capacity: { storage: 38400Gi }        # matches the 8-OST FSx from Step 4
  volumeMode: Filesystem
  accessModes: [ReadWriteMany]           # shared across pods (serve + any staging job)
  mountOptions: [flock]
  persistentVolumeReclaimPolicy: Retain  # never delete the pre-created FSx via the PV lifecycle
  csi:
    driver: fsx.csi.aws.com
    volumeHandle: ${FSX_ID}
    volumeAttributes:
      dnsname: ${FSX_DNS}
      mountname: ${FSX_MOUNT}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: fsx-dsv4p-pvc, namespace: default }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""                   # static binding — no dynamic provisioning
  volumeName: fsx-dsv4p-pv
  resources: { requests: { storage: 38400Gi } }
